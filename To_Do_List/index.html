<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <h1>To Do List</h1>
    <div class="add-task">
      <input type="text" id="taskInput" placeholder="Task" />
      <button onclick="addTask()">Add</button>
    </div>

    <div class="container">
      <div class="section">
        <h2>All Tasks</h2>
        <div id="allTasks"></div>
      </div>

      <div class="section">
        <h2>On Going</h2>
        <div id="ongoingTasks"></div>
      </div>

      <div class="section">
        <h2>Finished</h2>
        <div id="finishedTasks"></div>
      </div>
    </div>

    <script src="JS/main.js"></script>
  </body>
</html>
